schema_version: 1
status: normative

# Registration is descriptive. Activation/promotion is governed by AIOS policy
# and evidence; workload repositories remain independently owned.
# Every workload MUST publish aios/workload.json matching this declaration.
capabilities:
  - capability_id: try.research
    version: "1"
    kind: research_workload
    owner: yanhul/try
    source: https://github.com/yanhul/try
    manifest: aios/workload.json
    adapter: aios/adapter.py
    entrypoint: execute
    inputs: [natural_language_problem, research_contract]
    outputs: [experiment_ledger, research_report, terminal_state]
    verification: [regression_tests, locked_validation, locked_oos, provenance]
    context: [data_version, strategy_version, compute_environment]
    terminal_states: [EDGE_FOUND, NO_EDGE_FOUND, INCONCLUSIVE, BLOCKED]

  - capability_id: android.assistant
    version: "1"
    kind: software_device_workload
    owner: yanhul/android-ai-assistant
    source: https://github.com/yanhul/android-ai-assistant
    manifest: aios/workload.json
    adapter: aios/adapter.sh
    entrypoint: bash aios/adapter.sh
    inputs: [natural_language_command, execution_contract]
    outputs: [software_artifact, execution_result, verification_report]
    verification: [android_ci, adversarial_conformance, authority_boundary]
    context: [android_device, permissions, runtime, model_provider]
    terminal_states: [PASS, BLOCKED, INCONCLUSIVE]

  - capability_id: rx50.engineering
    version: "1"
    kind: hardware_engineering_workload
    owner: yanhul/RX50
    source: https://github.com/yanhul/RX50
    manifest: aios/workload.json
    adapter: aios/adapter.py
    entrypoint: execute
    inputs: [engineering_problem, requirements, evidence]
    outputs: [engineering_artifacts, evidence_report, terminal_state]
    verification: [requirements_coverage, contradiction_check, electrical_verification, physical_evidence]
    context: [component_revisions, measurements, hardware_state, toolchain]
    terminal_states: [PASS, BLOCKED, INCONCLUSIVE]

# Edges are created only when both endpoints are registered and the relation
# has explicit provenance/evidence. No relationship is assumed by registration.
relationships: []
