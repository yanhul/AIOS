schema_version: 1
status: normative

# Registration is descriptive. Activation/promotion is governed by AIOS policy
# and evidence; workload repositories remain independently owned.
# Every registered capability MUST declare a manifest at the path recorded below.
# A manifest may be published by the workload repository or by its AIOS adapter
# when the workload is external and cannot be modified as part of this repository.
capabilities:
  - capability_id: try.research
    version: "1"
    kind: research_workload
    owner: yanhul/try
    source: https://github.com/yanhul/try
    manifest: aios/workload.json
    inputs: [natural_language_problem, research_contract]
    outputs: [experiment_ledger, research_report, terminal_state]
    verification: [regression_tests, locked_validation, locked_oos, provenance]
    context: [data_version, strategy_version, compute_environment]
    terminal_states: [PASS, EDGE_FOUND, NO_EDGE_FOUND, INCONCLUSIVE, BLOCKED]

  - capability_id: android.assistant
    version: "1"
    kind: software_device_workload
    owner: yanhul/android-ai-assistant
    source: https://github.com/yanhul/android-ai-assistant
    manifest: aios/workload.json
    inputs: [natural_language_command, execution_contract]
    outputs: [software_artifact, execution_result, verification_report]
    verification: [android_ci, adversarial_conformance, authority_boundary]
    context: [android_device, permissions, runtime, model_provider]
    terminal_states: [PASS, BLOCKED, INCONCLUSIVE]

  - capability_id: rx50.engineering
    version: "1"
    kind: hardware_engineering_workload
    owner: yanhul/RX50
    source: https://github.com/yanhul/RX50
    manifest: aios/workload.json
    inputs: [engineering_problem, requirements, evidence]
    outputs: [engineering_artifacts, evidence_report, terminal_state]
    verification: [requirements_coverage, contradiction_check, electrical_verification, physical_evidence]
    context: [component_revisions, measurements, hardware_state, toolchain]
    terminal_states: [PASS, BLOCKED, INCONCLUSIVE]

  # MiniMind is a reusable model capability/provider, not an AIOS workload.
  # It may be consumed by workloads (e.g. research/assistant) through a
  # governed capability binding; its upstream repository remains external.
  - capability_id: minimind.model
    version: "1"
    kind: model_capability
    owner: jingyaogong/minimind
    source: https://github.com/jingyaogong/minimind
    manifest: adapters/minimind/workload.json
    inputs: [model_task, model_input, inference_contract]
    outputs: [model_output, capability_receipt, provenance]
    verification: [artifact_lineage, independent_evaluation, locked_holdout, provenance]
    context: [workload_revision, model_digest, tokenizer_digest, environment_digest]
    terminal_states: [AVAILABLE, BLOCKED, INCONCLUSIVE]

  # External skill provider. Registration is descriptive; the provider cannot
  # grant AIOS authority or alter policy/evidence/terminal criteria.
  - capability_id: software.audit
    version: "1"
    kind: skill_provider
    owner: ptn1411/skill
    source: https://github.com/ptn1411/skill
    manifest: external/skill/authorized-artifact-auditor
    inputs: [software_artifact, audit_contract]
    outputs: [audit_report, findings, remediation_plan]
    verification: [report_contract, regression_tests, provenance]
    context: [artifact_revision, analysis_environment, authorization_scope]
    terminal_states: [PASS, BLOCKED, INCONCLUSIVE]

# Edges are created only when both endpoints are registered and the relation
# has explicit provenance/evidence. No relationship is assumed by registration.
relationships: []
