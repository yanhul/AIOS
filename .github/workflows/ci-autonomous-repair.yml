name: AIOS CI Autonomous Repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: aios-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  propose:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted repair plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Fetch failed source object only
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$SHA"

      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
          test -s "$RUNNER_TEMP/ci-failure.log"

      - name: Reason-only proposal
        env:
          AIOS_REPAIR_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIOS_REPAIR_MODEL: ${{ vars.AIOS_REPAIR_MODEL }}
          AIOS_REPAIR_SHA: ${{ github.event.workflow_run.head_sha }}
          AIOS_REPAIR_RUN_ID: ${{ github.event.workflow_run.id }}
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
        run: |
          if [ -z "${AIOS_REPAIR_API_KEY:-}" ]; then
            echo "AIOS_REPAIR=BLOCKED missing reasoning-provider secret"
            exit 1
          fi
          python scripts/ci_repair_propose.py

      - name: Upload typed proposal
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ github.event.workflow_run.id }}
          path: repair-proposal.json
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted repair plane
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout failed source as inert workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          persist-credentials: false
          clean: true

      - name: Download typed proposal
        uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ github.event.workflow_run.id }}
          path: target

      - name: Apply through AIOS and run trusted pytest
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_apply.py"

      - name: Verify mutation scope
        working-directory: target
        run: |
          expected="$(python - <<'PY'
          import json
          print("\n".join(x["path"] for x in json.load(open("repair-proposal.json", encoding="utf-8"))["files"]))
          PY
          )"
          actual="$(git diff --name-only)"
          test "$(printf '%s\n' "$expected" | sort)" = "$(printf '%s\n' "$actual" | sort)"

      - name: Upload verified repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ github.event.workflow_run.id }}
          path: |
            target/repair-proposal.json
            target/repair-result.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted repair plane
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout exact failed base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          persist-credentials: false
          clean: true

      - name: Download proposal and verified test evidence
        uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ github.event.workflow_run.id }}
          path: evidence

      - name: Require prior PASS evidence
        run: |
          python - <<'PY'
          import json
          obj=json.load(open("evidence/repair-result.json", encoding="utf-8"))
          assert obj["test"]["status"] == "PASS"
          assert obj["test"]["evidence_refs"]
          assert obj["apply"]["state"] == "OBSERVED_SUCCESS"
          PY

      - name: Re-apply through trusted AIOS publisher only
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
        run: |
          cp "${{ github.workspace }}/evidence/repair-proposal.json" repair-proposal.json
          python "${{ github.workspace }}/trusted/scripts/ci_repair_publish.py"

      - name: Push repair branch and open PR
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch="aios/autorepair/${RUN_ID}"
          git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          gh pr create --repo "${{ github.repository }}" --base main --head "$branch" \
            --title "fix: autonomous repair for CI run ${RUN_ID}" \
            --body "Generated by AIOS bounded repair loop. Base: ${BASE_SHA}. Prior trusted pytest PASS evidence verified before privileged publication."
