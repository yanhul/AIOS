name: AIOS CI Autonomous Repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: aios-repair-branch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.event.workflow_run.id }}
  BASE_SHA: ${{ github.event.workflow_run.head_sha }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}

jobs:
  propose1:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.head_branch == 'main' ||
           startsWith(github.event.workflow_run.head_branch, 'aios/autorepair/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "1"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_PROVIDER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: PYTHONPATH=. python scripts/ci_repair_propose.py
      - run: cp repair-proposal.json repair-proposal-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: repair-proposal-1.json
          retention-days: 7

  apply1:
    needs: propose1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: target/p1
      - name: Apply attempt 1 and test
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/target/p1/repair-proposal-1.json
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
          status="$(python -c 'import json; print(json.load(open("repair-result.json"))["test"]["status"])')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp repair-result.json repair-result-1.json
      - name: Verify mutation scope
        working-directory: target
        run: |
          python - <<'PY'
          import json, subprocess
          expected=sorted(x["path"] for x in json.load(open("p1/repair-proposal-1.json"))["files"])
          actual=sorted(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-1
          path: target/repair-result-1.json
          retention-days: 7

  propose2:
    needs: apply1
    if: ${{ needs.apply1.outputs.status == 'FAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-1
          path: prior
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "2"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/repair-result-1.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_PROVIDER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: |
          python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: repair-proposal-2.json
          retention-days: 7

  apply2:
    needs: propose2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: target/p1
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: target/p2
      - name: Apply cumulative attempts 1-2 and test
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/target/p1/repair-proposal-1.json,${{ github.workspace }}/target/p2/repair-proposal-2.json
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
          status="$(python -c 'import json; print(json.load(open("repair-result.json"))["test"]["status"])')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp repair-result.json repair-result-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-2
          path: target/repair-result-2.json

  propose3:
    needs: apply2
    if: ${{ needs.apply2.outputs.status == 'FAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-2
          path: prior
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "3"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/repair-result-2.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_PROVIDER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_REPAIR_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: |
          python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: repair-proposal-3.json
          retention-days: 7

  apply3:
    needs: propose3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: target/p1
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: target/p2
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: target/p3
      - name: Apply cumulative attempts 1-3 and test
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/target/p1/repair-proposal-1.json,${{ github.workspace }}/target/p2/repair-proposal-2.json,${{ github.workspace }}/target/p3/repair-proposal-3.json
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
          status="$(python -c 'import json; print(json.load(open("repair-result.json"))["test"]["status"])')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp repair-result.json repair-result-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-3
          path: target/repair-result-3.json

  publish:
    needs: [apply1, apply2, apply3]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.apply1.outputs.status == 'PASS' ||
           needs.apply2.outputs.status == 'PASS' ||
           needs.apply3.outputs.status == 'PASS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-proposal-${{ env.RUN_ID }}-*
          path: target/proposals
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-result-${{ env.RUN_ID }}-*
          path: target/results
          merge-multiple: true
      - name: Select and verify PASS evidence
        working-directory: target
        run: |
          python - <<'PY'
          import glob, json, os
          passed=[]
          for path in glob.glob("results/repair-result-*.json"):
              obj=json.load(open(path,encoding="utf-8"))
              if obj["test"]["status"] == "PASS" and obj["test"]["evidence_refs"]:
                  passed.append(max(obj["attempts"]))
          if not passed:
              raise SystemExit("no independently recorded PASS evidence")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"AIOS_REPAIR_PASS_ATTEMPT={max(passed)}\n")
          PY
      - name: Re-apply cumulative proposals through trusted AIOS publisher
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_publish.py"
      - name: Push repair branch and open PR
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SOURCE_BRANCH" = "main" ]; then
            branch="aios/autorepair/${RUN_ID}"
          else
            branch="$SOURCE_BRANCH"
          fi
          case "$branch" in
            aios/autorepair/*) ;;
            *) echo "BLOCKED: unauthorized repair branch: $branch"; exit 1 ;;
          esac
          git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          gh workflow run CI --repo "${{ github.repository }}" --ref "$branch"
          if [ "$SOURCE_BRANCH" = "main" ]; then
            gh pr create --repo "${{ github.repository }}" --base main --head "$branch" --title "fix: autonomous repair for CI run ${RUN_ID}" --body "Generated by AIOS bounded iterative repair loop."
          fi