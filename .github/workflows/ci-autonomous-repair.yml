name: AIOS CI Autonomous Repair

# Trust layout per attempt N:
#   proposeN (TRY provider) -> applyN (trusted: AIOS authority secret, never runs
#   proposed code) -> testN (untrusted: runs proposed code; no secrets, read-only
#   token). The verdict is testN's job result, never a file the proposal can write.
#   publish re-applies through AIOS and requires the tree to match applyN's record.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed CI workflow run ID"
        required: true
        type: string
      base_sha:
        description: "Exact failed CI head SHA"
        required: true
        type: string
      source_branch:
        description: "Exact failed CI head branch"
        required: true
        type: string

permissions: {}

concurrency:
  group: aios-repair-branch-${{ inputs.source_branch }}
  cancel-in-progress: true

env:
  RUN_ID: ${{ inputs.run_id }}
  BASE_SHA: ${{ inputs.base_sha }}
  SOURCE_BRANCH: ${{ inputs.source_branch }}

jobs:
  propose1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate dispatch inputs and resolve failed CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "BLOCKED: invalid run_id"; exit 1; }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: invalid base_sha"; exit 1; }
          [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "BLOCKED: invalid source_branch"; exit 1; }
          case "$SOURCE_BRANCH" in
            main|aios/autorepair/*) ;;
            *) echo "BLOCKED: unauthorized source branch"; exit 1 ;;
          esac
          run_json="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,conclusion,workflowName)"
          jq -e --arg sha "$BASE_SHA" --arg branch "$SOURCE_BRANCH" \
            '.headSha == $sha and .headBranch == $branch and .conclusion == "failure"
             and (.workflowName == "CI" or .workflowName == "G4A CI")' <<<"$run_json" >/dev/null \
            || { echo "BLOCKED: run $RUN_ID is not a failed CI run for $BASE_SHA on $SOURCE_BRANCH"; exit 1; }
      - run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "1"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          TRY_REPAIR_WORKER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: |
          PYTHONPATH=. python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: repair-proposal-1.json
          retention-days: 7

  apply1:
    needs: propose1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - name: Apply cumulative proposals 1-1 through AIOS (trusted, no test execution)
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "1"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json
          AIOS_REPAIR_APPLY_RECORD: ${{ runner.temp }}/apply/repair-apply-1.json
          AIOS_REPAIR_STATE_DIR: ${{ runner.temp }}/aios-state-apply-1
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_apply_attempt.py"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-state-${{ env.RUN_ID }}-apply-1
          path: ${{ runner.temp }}/aios-state-apply-1
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-1
          path: ${{ runner.temp }}/apply/repair-apply-1.json
          retention-days: 7

  test1:
    needs: apply1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/apply
      - name: Stage proposal tree and verify it matches the trusted apply record
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "1"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json
          AIOS_REPAIR_APPLY_RECORD: ${{ github.workspace }}/apply/repair-apply-1.json
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_stage_test_tree.py"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML cryptography
      - name: Run tests on proposed tree (untrusted; verdict is this job's result)
        working-directory: target
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-1.log"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-test-log-${{ env.RUN_ID }}-1
          path: ${{ runner.temp }}/pytest-1.log
          if-no-files-found: ignore
          retention-days: 7

  propose2:
    needs: [apply1, test1]
    if: ${{ !cancelled() && needs.apply1.result == 'success' && needs.test1.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-1
          path: prior
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aios-repair-test-log-${{ env.RUN_ID }}-1
          path: prior
      - name: Build previous attempt feedback from trusted job result
        env:
          PRIOR_ATTEMPT: "1"
        run: |
          python - <<'PY'
          import json, os, pathlib
          n = os.environ["PRIOR_ATTEMPT"]
          prior = pathlib.Path("prior")
          log = prior / f"pytest-{n}.log"
          feedback = {
              "schema": 3, "attempt": int(n),
              "test": {"status": "FAIL", "source": "github-job-result"},
              "apply_record": json.loads((prior / f"repair-apply-{n}.json").read_text(encoding="utf-8")),
              "untrusted_test_log_tail": log.read_text(encoding="utf-8", errors="replace")[-12000:] if log.exists() else "",
          }
          (prior / "previous-result.json").write_text(json.dumps(feedback, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "2"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/previous-result.json
          TRY_REPAIR_WORKER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: |
          PYTHONPATH=. python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: repair-proposal-2.json
          retention-days: 7

  apply2:
    needs: propose2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/proposals
      - name: Apply cumulative proposals 1-2 through AIOS (trusted, no test execution)
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "2"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json,${{ github.workspace }}/proposals/repair-proposal-2.json
          AIOS_REPAIR_APPLY_RECORD: ${{ runner.temp }}/apply/repair-apply-2.json
          AIOS_REPAIR_STATE_DIR: ${{ runner.temp }}/aios-state-apply-2
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_apply_attempt.py"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-state-${{ env.RUN_ID }}-apply-2
          path: ${{ runner.temp }}/aios-state-apply-2
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-2
          path: ${{ runner.temp }}/apply/repair-apply-2.json
          retention-days: 7

  test2:
    needs: apply2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/apply
      - name: Stage proposal tree and verify it matches the trusted apply record
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "2"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json,${{ github.workspace }}/proposals/repair-proposal-2.json
          AIOS_REPAIR_APPLY_RECORD: ${{ github.workspace }}/apply/repair-apply-2.json
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_stage_test_tree.py"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML cryptography
      - name: Run tests on proposed tree (untrusted; verdict is this job's result)
        working-directory: target
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-2.log"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-test-log-${{ env.RUN_ID }}-2
          path: ${{ runner.temp }}/pytest-2.log
          if-no-files-found: ignore
          retention-days: 7

  propose3:
    needs: [apply2, test2]
    if: ${{ !cancelled() && needs.apply2.result == 'success' && needs.test2.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-2
          path: prior
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aios-repair-test-log-${{ env.RUN_ID }}-2
          path: prior
      - name: Build previous attempt feedback from trusted job result
        env:
          PRIOR_ATTEMPT: "2"
        run: |
          python - <<'PY'
          import json, os, pathlib
          n = os.environ["PRIOR_ATTEMPT"]
          prior = pathlib.Path("prior")
          log = prior / f"pytest-{n}.log"
          feedback = {
              "schema": 3, "attempt": int(n),
              "test": {"status": "FAIL", "source": "github-job-result"},
              "apply_record": json.loads((prior / f"repair-apply-{n}.json").read_text(encoding="utf-8")),
              "untrusted_test_log_tail": log.read_text(encoding="utf-8", errors="replace")[-12000:] if log.exists() else "",
          }
          (prior / "previous-result.json").write_text(json.dumps(feedback, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "3"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/previous-result.json
          TRY_REPAIR_WORKER_URL: ${{ vars.TRY_REPAIR_WORKER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_PROVIDER_TOKEN }}
        run: |
          PYTHONPATH=. python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: repair-proposal-3.json
          retention-days: 7

  apply3:
    needs: propose3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: ${{ github.workspace }}/proposals
      - name: Apply cumulative proposals 1-3 through AIOS (trusted, no test execution)
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "3"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json,${{ github.workspace }}/proposals/repair-proposal-2.json,${{ github.workspace }}/proposals/repair-proposal-3.json
          AIOS_REPAIR_APPLY_RECORD: ${{ runner.temp }}/apply/repair-apply-3.json
          AIOS_REPAIR_STATE_DIR: ${{ runner.temp }}/aios-state-apply-3
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_apply_attempt.py"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-state-${{ env.RUN_ID }}-apply-3
          path: ${{ runner.temp }}/aios-state-apply-3
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-3
          path: ${{ runner.temp }}/apply/repair-apply-3.json
          retention-days: 7

  test3:
    needs: apply3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: ${{ github.workspace }}/proposals
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-apply-${{ env.RUN_ID }}-3
          path: ${{ github.workspace }}/apply
      - name: Stage proposal tree and verify it matches the trusted apply record
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_ATTEMPT: "3"
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/proposals/repair-proposal-1.json,${{ github.workspace }}/proposals/repair-proposal-2.json,${{ github.workspace }}/proposals/repair-proposal-3.json
          AIOS_REPAIR_APPLY_RECORD: ${{ github.workspace }}/apply/repair-apply-3.json
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_stage_test_tree.py"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML cryptography
      - name: Run tests on proposed tree (untrusted; verdict is this job's result)
        working-directory: target
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-3.log"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-test-log-${{ env.RUN_ID }}-3
          path: ${{ runner.temp }}/pytest-3.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [apply1, test1, apply2, test2, apply3, test3]
    if: >-
      ${{ !cancelled() &&
          (needs.test1.result == 'success' ||
           needs.test2.result == 'success' ||
           needs.test3.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      AIOS_REPAIR_PASS_ATTEMPT: >-
        ${{ needs.test1.result == 'success' && '1' ||
            needs.test2.result == 'success' && '2' || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-proposal-${{ env.RUN_ID }}-*
          path: ${{ github.workspace }}/proposals
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-apply-${{ env.RUN_ID }}-*
          path: ${{ github.workspace }}/apply
          merge-multiple: true
      - name: Re-apply cumulative proposals through trusted AIOS publisher
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          AIOS_REPAIR_PROPOSALS_DIR: ${{ github.workspace }}/proposals
          AIOS_REPAIR_APPLY_DIR: ${{ github.workspace }}/apply
          AIOS_REPAIR_STATE_DIR: ${{ runner.temp }}/aios-state-publish
          AIOS_REPAIR_CHAIN_REPORT: ${{ runner.temp }}/aios-state-publish-chain.json
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_publish.py"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-repair-state-${{ env.RUN_ID }}-publish
          path: |
            ${{ runner.temp }}/aios-state-publish
            ${{ runner.temp }}/aios-state-publish-chain.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Push repair branch and open PR
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SOURCE_BRANCH" = "main" ]; then
            branch="aios/autorepair/${RUN_ID}"
          else
            branch="$SOURCE_BRANCH"
          fi
          case "$branch" in
            aios/autorepair/*) ;;
            *) echo "BLOCKED: unauthorized repair branch: $branch"; exit 1 ;;
          esac
          if ! git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"; then
            git fetch origin "$branch"
            git diff --quiet "origin/$branch" HEAD -- || {
              echo "BLOCKED: remote repair branch diverged from verified local repair tree"
              exit 1
            }
            git reset --hard "origin/$branch"
          fi
          gh workflow run CI --repo "${GITHUB_REPOSITORY}" --ref "$branch"
          gh workflow run "G4A CI" --repo "${GITHUB_REPOSITORY}" --ref "$branch"
          if [ "$SOURCE_BRANCH" = "main" ]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "$branch" --title "fix: autonomous repair for CI run ${RUN_ID}" --body "Generated by AIOS bounded iterative repair loop."
          fi