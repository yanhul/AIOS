name: AIOS CI Autonomous Repair

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed CI workflow run ID"
        required: true
        type: string
      base_sha:
        description: "Exact failed CI head SHA"
        required: true
        type: string
      source_branch:
        description: "Exact failed CI head branch"
        required: true
        type: string

permissions: {}

concurrency:
  group: aios-repair-branch-${{ github.event.workflow_run.head_branch || inputs.source_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  BASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.base_sha || github.sha }}
  SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.source_branch || github.ref_name }}

jobs:
  propose1:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref_name == 'aios/autorepair/g4a-live') ||
           (github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (github.event.workflow_run.head_branch == 'main' ||
             startsWith(github.event.workflow_run.head_branch, 'aios/autorepair/'))) ||
           (github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'aios/autorepair/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve failed CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ env.BASE_SHA }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ env.SOURCE_BRANCH }}
          TRIGGER_RUN_ID: ${{ env.RUN_ID }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            ci_run_id="$TRIGGER_RUN_ID"
          else
            ci_run_id=""
            workflow_name="CI"
            if [ "$EVENT" = "push" ] && [ "${{ github.ref_name }}" = "aios/autorepair/g4a-live" ]; then
              workflow_name="G4A CI"
            fi
            for i in $(seq 1 60); do
              run_json="$(gh run list --repo "$REPO" --workflow "$workflow_name" --commit "$SHA" --limit 1 --json databaseId,status,conclusion)"
              ci_run_id="$(jq -r '.[0].databaseId // empty' <<<"$run_json")"
              status="$(jq -r '.[0].status // empty' <<<"$run_json")"
              conclusion="$(jq -r '.[0].conclusion // empty' <<<"$run_json")"
              echo "CI run=$ci_run_id status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then break; fi
              sleep 10
            done
          fi
          [ -n "$ci_run_id" ] || { echo "BLOCKED: failed CI run ID is missing"; exit 1; }
          run_json="$(gh api "repos/$REPO/actions/runs/$ci_run_id")"
          run_repo="$(jq -r '.repository.full_name // empty' <<<"$run_json")"
          head_repo="$(jq -r '.head_repository.full_name // empty' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          status="$(jq -r '.status // empty' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          echo "Verified source CI run=$ci_run_id repo=$run_repo head_repo=$head_repo branch=$head_branch sha=$head_sha status=$status conclusion=$conclusion"
          [ "$run_repo" = "$REPO" ] && [ "$head_repo" = "$REPO" ] || { echo "BLOCKED: CI run is not from this repository"; exit 1; }
          [ "$head_sha" = "$SHA" ] && [ "$head_branch" = "$BRANCH" ] || { echo "BLOCKED: CI run SHA/branch does not match requested repair target"; exit 1; }
          [ "$status" = "completed" ] && [ "$conclusion" = "failure" ] || { echo "BLOCKED: source CI run is not a completed failure"; exit 1; }
          echo "CI_RUN_ID=$ci_run_id" >> "$GITHUB_ENV"
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - name: Capture failed CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$CI_RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_ATTEMPT: "1"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_WORKER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: |
          export AIOS_REPAIR_RUN_ID="$CI_RUN_ID"
          PYTHONPATH=. python scripts/ci_repair_propose.py
      - run: cp repair-proposal.json repair-proposal-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: repair-proposal-1.json
          retention-days: 7

  apply1:
    needs: propose1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/p1
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Apply cumulative proposal patch(es) through AIOS authority
        id: apply
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
      - name: Run trusted tests in a separate credential-free step
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_run_trusted_tests.py"
      - name: Reconcile permit, receipt, patch and trusted-test evidence
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_reconcile.py"
          cp repair-result.json repair-result-1.json
      - name: Verify mutation scope
        working-directory: target
        run: |
          python - <<'PY'
          import json, subprocess
          expected=sorted(x["path"] for x in json.load(open("${{ github.workspace }}/p1/repair-proposal-1.json"))["files"])
          actual=sorted(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-1
          path: target/repair-result-1.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-authority-${{ env.RUN_ID }}-1
          path: ${{ runner.temp }}/aios-repair-authority
          retention-days: 7

  propose2:
    needs: apply1
    if: ${{ needs.apply1.outputs.status == 'FAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-1
          path: prior
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_ATTEMPT: "2"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/repair-result-1.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_WORKER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: |
          export AIOS_REPAIR_RUN_ID="$RUN_ID"
          PYTHONPATH=. python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: repair-proposal-2.json
          retention-days: 7

  apply2:
    needs: propose2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/p1
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/p2
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Apply cumulative proposal patch(es) through AIOS authority
        id: apply
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
      - name: Run trusted tests in a separate credential-free step
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_run_trusted_tests.py"
      - name: Reconcile permit, receipt, patch and trusted-test evidence
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_reconcile.py"
          cp repair-result.json repair-result-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-2
          path: target/repair-result-2.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-authority-${{ env.RUN_ID }}-2
          path: ${{ runner.temp }}/aios-repair-authority
          retention-days: 7

  propose3:
    needs: apply2
    if: ${{ needs.apply2.outputs.status == 'FAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          SHA: ${{ env.BASE_SHA }}
        run: git fetch --no-tags --depth=1 origin "$SHA"
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-2
          path: prior
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > "$RUNNER_TEMP/ci-failure.log" || true
      - name: Dispatch bounded proposal request to TRY
        env:
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_ATTEMPT: "3"
          AIOS_REPAIR_LOG: ${{ runner.temp }}/ci-failure.log
          AIOS_REPAIR_PREVIOUS_RESULT: ${{ github.workspace }}/prior/repair-result-2.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRY_REPAIR_WORKER_URL: ${{ secrets.TRY_REPAIR_PROVIDER_URL }}
          TRY_PROVIDER_TOKEN: ${{ secrets.TRY_REPAIR_PROVIDER_TOKEN }}
        run: |
          export AIOS_REPAIR_RUN_ID="$RUN_ID"
          PYTHONPATH=. python scripts/ci_repair_propose.py
          cp repair-proposal.json repair-proposal-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: repair-proposal-3.json
          retention-days: 7

  apply3:
    needs: propose3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-1
          path: ${{ github.workspace }}/p1
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-2
          path: ${{ github.workspace }}/p2
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-proposal-${{ env.RUN_ID }}-3
          path: ${{ github.workspace }}/p3
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Apply cumulative proposal patch(es) through AIOS authority
        id: apply
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json,${{ github.workspace }}/p3/repair-proposal-3.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_SIGNING_KEYS: ${{ secrets.AIOS_PROVIDER_SIGNING_KEYS }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_apply_attempt.py"
      - name: Run trusted tests in a separate credential-free step
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json,${{ github.workspace }}/p3/repair-proposal-3.json
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_run_trusted_tests.py"
      - name: Reconcile permit, receipt, patch and trusted-test evidence
        id: result
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PROPOSALS: ${{ github.workspace }}/p1/repair-proposal-1.json,${{ github.workspace }}/p2/repair-proposal-2.json,${{ github.workspace }}/p3/repair-proposal-3.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ runner.temp }}/aios-repair-authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: |
          python "${{ github.workspace }}/trusted/scripts/ci_repair_reconcile.py"
          cp repair-result.json repair-result-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-3
          path: target/repair-result-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-authority-${{ env.RUN_ID }}-3
          path: ${{ runner.temp }}/aios-repair-authority
          retention-days: 7

  publish:
    needs: [apply1, apply2, apply3]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.apply1.outputs.status == 'PASS' ||
           needs.apply2.outputs.status == 'PASS' ||
           needs.apply3.outputs.status == 'PASS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    outputs:
      pass_attempt: ${{ env.AIOS_REPAIR_PASS_ATTEMPT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          clean: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-proposal-${{ env.RUN_ID }}-*
          path: ${{ github.workspace }}/proposals
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-result-${{ env.RUN_ID }}-*
          path: ${{ github.workspace }}/results
          merge-multiple: true
      - name: Select and verify PASS evidence
        working-directory: target
        run: |
          python - <<'PY'
          import glob, json, os
          passed=[]
          for path in glob.glob(os.path.join(os.environ["GITHUB_WORKSPACE"], "results", "repair-result-*.json")):
              obj=json.load(open(path,encoding="utf-8"))
              if (obj.get("schema") == 3 and obj.get("status") == "REPAIR_E2E_PASS"
                      and obj.get("reconciliation", {}).get("status") == "RECONCILED"
                      and obj["test"]["status"] == "PASS" and obj["test"]["evidence_refs"]):
                  passed.append(max(obj["attempts"]))
          if not passed:
              raise SystemExit("no independently recorded PASS evidence")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"AIOS_REPAIR_PASS_ATTEMPT={max(passed)}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-authority-${{ env.RUN_ID }}-${{ env.AIOS_REPAIR_PASS_ATTEMPT }}
          path: ${{ github.workspace }}/authority
      - name: Reconcile persisted authority, receipt and trusted-test evidence before publish
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_PASS_ATTEMPT: ${{ env.AIOS_REPAIR_PASS_ATTEMPT }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          AIOS_REPAIR_PROPOSALS_DIR: ${{ github.workspace }}/proposals
          AIOS_REPAIR_RESULT_FILE: ${{ github.workspace }}/results/repair-result-${{ env.AIOS_REPAIR_PASS_ATTEMPT }}.json
          AIOS_REPAIR_AUTHORITY_DIR: ${{ github.workspace }}/authority
          AIOS_AUTHORITY_ATTESTATION_SECRET: ${{ secrets.AIOS_AUTHORITY_ATTESTATION_SECRET }}
          AIOS_PROVIDER_KEYRING: ${{ secrets.AIOS_PROVIDER_KEYRING }}
        run: python "${{ github.workspace }}/trusted/scripts/ci_repair_publish.py"
      - name: Write candidate provenance statement and commit bundle
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          AIOS_REPAIR_PASS_ATTEMPT: ${{ env.AIOS_REPAIR_PASS_ATTEMPT }}
          AIOS_REPAIR_RESULT_FILE: ${{ github.workspace }}/results/repair-result-${{ env.AIOS_REPAIR_PASS_ATTEMPT }}.json
        run: python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_provenance.py" statement "$RUNNER_TEMP/candidate"
      - name: Sign candidate provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/candidate/candidate-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: aios-repair-candidate-${{ env.RUN_ID }}
          path: ${{ runner.temp }}/candidate
          retention-days: 7

  verify-candidate:
    # Gate before review: no write permissions; the candidate is not pushed unless this passes.
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-candidate-${{ env.RUN_ID }}
          path: ${{ github.workspace }}/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: aios-repair-proposal-${{ env.RUN_ID }}-*
          path: ${{ github.workspace }}/proposals
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-result-${{ env.RUN_ID }}-${{ needs.publish.outputs.pass_attempt }}
          path: ${{ github.workspace }}/results
      - name: Verify attestation signer, statement and candidate commit
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/trusted
          AIOS_REPAIR_SHA: ${{ env.BASE_SHA }}
          AIOS_REPAIR_RUN_ID: ${{ env.RUN_ID }}
          AIOS_REPAIR_SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          AIOS_REPAIR_PASS_ATTEMPT: ${{ needs.publish.outputs.pass_attempt }}
        run: |
          set -euo pipefail
          gh attestation verify "$GITHUB_WORKSPACE/candidate/candidate-provenance.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci-autonomous-repair.yml" \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/attestation.json"
          python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_provenance.py" verify \
            "$GITHUB_WORKSPACE/candidate/candidate-provenance.json" "$GITHUB_WORKSPACE/candidate/candidate.bundle" \
            "$RUNNER_TEMP/attestation.json" "$GITHUB_WORKSPACE/proposals" \
            "$GITHUB_WORKSPACE/results/repair-result-${AIOS_REPAIR_PASS_ATTEMPT}.json"

  submit-candidate:
    # Enters review only after verify-candidate; never targets main and never merges.
    needs: [publish, verify-candidate]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.verify-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aios-repair-candidate-${{ env.RUN_ID }}
          path: ${{ github.workspace }}/candidate
      - name: Push verified candidate to its own branch and open draft PR
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prov="$GITHUB_WORKSPACE/candidate/candidate-provenance.json"
          commit="$(jq -r .commit "$prov")"
          branch="$(jq -r .candidate_branch "$prov")"
          [ "$branch" = "aios/autorepair/${RUN_ID}-${GITHUB_RUN_ID}" ] || { echo "BLOCKED: unexpected candidate branch: $branch"; exit 1; }
          case "$SOURCE_BRANCH" in
            main) pr_base=main ;;
            aios/autorepair/*) pr_base="$SOURCE_BRANCH" ;;
            *) echo "BLOCKED: unauthorized source branch"; exit 1 ;;
          esac
          git fetch -q --no-tags "$GITHUB_WORKSPACE/candidate/candidate.bundle" "+HEAD:refs/aios/candidate"
          [ "$(git rev-parse refs/aios/candidate)" = "$commit" ] || { echo "BLOCKED: bundle commit changed after verification"; exit 1; }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          candidate_tree="$(git rev-parse "${commit}^{tree}")"
          check_submission_base() {
            local ref_line base_sha base_tree
            ref_line="$(git ls-remote "$remote" "refs/heads/${pr_base}")"
            [ -n "$ref_line" ] || { echo "BLOCKED: BASE_REF_UNRESOLVED ${pr_base}"; exit 1; }
            base_sha="$(cut -f1 <<<"$ref_line")"
            [ -n "$base_sha" ] || { echo "BLOCKED: BASE_REF_UNRESOLVED ${pr_base}"; exit 1; }
            base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${base_sha}" --jq '.tree.sha')"
            [ -n "$base_tree" ] || { echo "BLOCKED: BASE_TREE_UNRESOLVED"; exit 1; }
            python "$GITHUB_WORKSPACE/trusted/scripts/ci_repair_provenance.py" submission-check "$prov" "$base_sha" "$base_tree" "$candidate_tree"
          }
          # Gate immediately before any candidate ref is created or pushed.
          check_submission_base
          existing="$(git ls-remote "$remote" "refs/heads/${branch}" | cut -f1)"
          if [ -z "$existing" ]; then
            git push "$remote" "${commit}:refs/heads/${branch}"
            echo "CANDIDATE_PUSHED ${branch} ${commit}"
            gh workflow run CI --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run "G4A CI" --repo "$GITHUB_REPOSITORY" --ref "$branch"
          elif [ "$existing" = "$commit" ]; then
            echo "CANDIDATE_IDEMPOTENT ${branch} ${commit}"
          else
            echo "BLOCKED: ${branch} already holds ${existing}, not ${commit}; refusing to overwrite"
            exit 1
          fi
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number,headRefOid)"
          if [ "$(jq length <<<"$prs")" -eq 0 ]; then
            # Re-resolve the base immediately before PR creation; a race blocks PR creation.
            check_submission_base
            statement_digest="sha256:$(sha256sum "$prov" | cut -d' ' -f1)"
            body="AIOS repair candidate (draft, human review required; never auto-merged).

          - Source CI run: ${RUN_ID} (base ${BASE_SHA})
          - Repair run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Candidate commit: ${commit}
          - Patch digest: $(jq -r .patch_digest "$prov")
          - Reconciliation digest: $(jq -r .reconciliation_digest "$prov")
          - Provenance statement: ${statement_digest} (artifact aios-repair-candidate-${RUN_ID}, verified by verify-candidate)"
            gh pr create --draft --repo "$GITHUB_REPOSITORY" --base "$pr_base" --head "$branch" \
              --title "fix: autonomous repair for CI run ${RUN_ID}" --body "$body"
          elif [ "$(jq -r '.[0].headRefOid' <<<"$prs")" != "$commit" ]; then
            echo "BLOCKED: existing PR for ${branch} points at a different commit"; exit 1
          else
            echo "DRAFT_PR_IDEMPOTENT $(jq -r '.[0].number' <<<"$prs")"
          fi
