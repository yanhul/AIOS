name: AIOS Research -> Absorption Intake
on:
  push:
    branches: [main]
    paths-ignore:
      - "research/artifacts/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  scan-and-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded ecosystem scan
        env: {GITHUB_TOKEN: ${{ github.token }}}
        run: python research/daily_ecosystem_scan.py
      - name: Build governed candidates
        run: python research/absorption_pipeline.py
      - name: Research and adapt candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python research/absorption_executor.py
      - name: Install absorption test runner
        run: python -m pip install pytest
      - name: Verify intake and executor invariants
        run: python -m pytest tests/test_absorption_*.py -v
      - name: Independently verify adaptation conformance
        env: {GITHUB_RUN_ID: ${{ github.run_id}}}
        run: python research/absorption_verifier.py
      - name: Prove AIOS-native implementation and runtime
        env: {GITHUB_RUN_ID: ${{ github.run_id}}}
        run: python research/absorption_runtime_proof.py
      - name: Run bounded autonomous repair obligations\n        if: always()\n        env: {GITHUB_RUN_ID: ${{ github.run_id }}}\n        run: python research/absorption_repair.py\n      - name: Apply fail-closed evidence promotion gate
        if: always()
        run: python research/absorption_promotion.py
      - name: Materialize only proven absorption
        if: always()
        env: {GITHUB_RUN_ID: ${{ github.run_id}}}
        run: python research/absorption_apply.py
      - name: Publish absorption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-absorption-runtime-${{ github.run_id }}
          path: research/artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist research and promotion artifacts
        if: always()
        run: |
          git config user.name "aios-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/artifacts
          git diff --cached --quiet || git commit -m "research: record governed absorption"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
