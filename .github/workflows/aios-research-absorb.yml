name: AIOS Research -> Absorption Intake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan-and-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded ecosystem scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/daily_ecosystem_scan.py

      - name: Build governed absorption candidates
        run: python research/absorption_pipeline.py

      - name: Verify intake invariants
        run: python -m unittest discover -s tests -p 'test_absorption_pipeline.py' -v

      - name: Persist research artifacts
        run: |
          git config user.name "aios-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/artifacts
          git diff --cached --quiet || git commit -m "research: record daily absorption intake"
          git push
