name: AIOS Research -> Absorption Intake
on:
  workflow_dispatch:

# Research intake is deliberately read-only. Signing and effects are separate,
# protected operations; this workflow never receives production signing secrets.
permissions:
  actions: read
  contents: read

concurrency:
  group: aios-research-absorb-main
  cancel-in-progress: false

jobs:
  research-intake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove tracked outputs from earlier runs
        run: |
          rm -f research/artifacts/absorption-executor.json
          rm -f research/artifacts/absorption-verification.json
          rm -f research/artifacts/absorption-runtime-proof.json
          rm -f research/artifacts/absorption-repair.json
          rm -f research/artifacts/absorption-promotion.json
          rm -f research/artifacts/absorption.json

      - name: Run bounded ecosystem scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/daily_ecosystem_scan.py

      - name: Build governed candidates
        run: python research/absorption_pipeline.py

      - name: Research and adapt candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python research/absorption_executor.py

      - name: Install absorption test runner
        run: python -m pip install pytest

      - name: Verify intake and executor invariants
        run: python -m pytest tests/test_absorption_*.py -v

      # No verifier/promotion/apply here: those require independently approved
      # governance and signer artifacts. This job only publishes untrusted research.
      - name: Publish untrusted research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-absorption-research-${{ github.run_id }}
          path: research/artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
