name: Repair Submission Gate Tests

on:
  pull_request:
    branches:
      - fix/repair-e2e-authority-receipt-reconcile
  push:
    branches:
      - devin/1795342197-repair-candidate-provenance

permissions:
  contents: read

concurrency:
  group: repair-submission-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile changed Python modules
        run: python -m compileall -q scripts/ci_repair_provenance.py tests/test_ci_repair_provenance.py
      - name: Run provenance and submission-gate tests
        run: python -m pytest -q tests/test_ci_repair_provenance.py
