name: AIOS PCB EDA Durable Run

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository containing SCH/PCB/PRJ"
        required: true
        default: "yanhul/temp"
        type: string
      ref:
        description: "Input repository ref"
        required: true
        default: "main"
        type: string
      max_retries:
        description: "Bounded retry budget"
        required: true
        default: "3"
        type: string
  push:
    branches: [main]
    paths:
      - "core/blocked_continuation.py"
      - "core/durable_loop.py"
      - "core/orchestrator.py"
      - "adapters/pcb_eda/**"
      - "capabilities/registry.yaml"

permissions:
  contents: read

concurrency:
  group: aios-pcb-eda-durable
  cancel-in-progress: false

jobs:
  pcb-eda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted AIOS
        uses: actions/checkout@v4
        with:
          ref: main
          path: aios
          persist-credentials: false

      - name: Checkout Audit Kit and input
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo || 'yanhul/temp' }}
          ref: ${{ inputs.ref || 'main' }}
          path: kit
          persist-credentials: false

      - name: Install runtime
        run: python -m pip install pytest PyYAML

      - name: Validate continuation contract
        working-directory: aios
        run: python -m pytest -q tests/test_blocked_continuation.py

      - name: Dispatch pcb.eda@1
        working-directory: aios
        env:
          INPUT_ROOT: $GITHUB_WORKSPACE/kit
          KIT_ROOT: $GITHUB_WORKSPACE/kit
          MAX_RETRIES: ${{ inputs.max_retries || '3' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/pcb-output"
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/aios" python "$GITHUB_WORKSPACE/aios/adapters/pcb_eda/adapter.py" \
            --task-id "aios-pcb-$GITHUB_RUN_ID" \
            --input "$INPUT_ROOT" \
            --output "$GITHUB_WORKSPACE/pcb-output" \
            --kit-root "$KIT_ROOT" \
            --config "$KIT_ROOT/altium-audit.config.json" \
            --max-retries "$MAX_RETRIES" \
            | tee "$GITHUB_WORKSPACE/pcb-output/adapter-result.json"
          rc=${PIPESTATUS[0]}
          echo "adapter_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require terminal receipt
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["GITHUB_WORKSPACE"]) / "pcb-output" / "summary.json"
          if not p.is_file():
              raise SystemExit("BLOCKED: missing Audit Kit terminal receipt")
          obj=json.loads(p.read_text())
          print("KIT_STATUS=", obj.get("status"))
          if obj.get("status") not in {"PASS","BLOCKED","INCONCLUSIVE"}:
              raise SystemExit("BLOCKED: invalid terminal status")
          PY

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: aios-pcb-eda-e2e-${{ github.run_id }}
          path: pcb-output
          retention-days: 90
