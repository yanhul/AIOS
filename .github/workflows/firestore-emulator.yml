name: Firestore Emulator Gate

on:
  pull_request:
    branches:
      - integration/firestore-execution-ledger-v1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Firestore SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-firestore.txt pytest cryptography PyYAML
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "511.0.0"
      - name: Install Firestore Emulator component
        run: gcloud components install cloud-firestore-emulator --quiet
      - name: Start Firestore Emulator
        run: |
          mkdir -p "$RUNNER_TEMP/firestore-emulator"
          gcloud emulators firestore start \
            --host-port=127.0.0.1:8080 \
            --project=aios-emulator-test \
            >"$RUNNER_TEMP/firestore-emulator/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/firestore-emulator/pid"
          for i in $(seq 1 60); do
            if python -c "import socket; s=socket.create_connection((\"127.0.0.1\",8080),timeout=1); s.close()" 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/firestore-emulator/emulator.log"
          exit 1
      - name: Run Firestore SDK integration tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GOOGLE_CLOUD_PROJECT: aios-emulator-test
          AIOS_FIRESTORE_PROJECT_ID: aios-emulator-test
        run: python -m pytest -q tests/test_firestore_emulator_integration.py
      - name: Run full repository test suite (including live emulator tests)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GOOGLE_CLOUD_PROJECT: aios-emulator-test
          AIOS_FIRESTORE_PROJECT_ID: aios-emulator-test
        run: python -m pytest -q
      - name: Build worker OCI image twice and compare app/dependency manifests (no push, no deployment)
        run: |
          docker build --pull=false --file Dockerfile.firestore-worker --tag aios-firestore-worker:first .
          docker run --rm aios-firestore-worker:first python -m pip freeze --all | sort > "$RUNNER_TEMP/worker-deps-first.txt"
          docker run --rm aios-firestore-worker:first python -c 'import hashlib,pathlib; roots=[pathlib.Path("/app/core"),pathlib.Path("/app/aios_worker_adapters"),pathlib.Path("/app/worker_wsgi.py")]; h=hashlib.sha256(); [(h.update(str(p.relative_to("/app")).encode()), h.update(p.read_bytes())) if p.is_file() else [(h.update(str(f.relative_to("/app")).encode()), h.update(f.read_bytes())) for f in sorted(p.rglob("*")) if f.is_file()] for p in roots]; print(h.hexdigest())' > "$RUNNER_TEMP/worker-app-first.sha256"
          docker build --pull=false --no-cache --file Dockerfile.firestore-worker --tag aios-firestore-worker:second .
          docker run --rm aios-firestore-worker:second python -m pip freeze --all | sort > "$RUNNER_TEMP/worker-deps-second.txt"
          docker run --rm aios-firestore-worker:second python -c 'import hashlib,pathlib; roots=[pathlib.Path("/app/core"),pathlib.Path("/app/aios_worker_adapters"),pathlib.Path("/app/worker_wsgi.py")]; h=hashlib.sha256(); [(h.update(str(p.relative_to("/app")).encode()), h.update(p.read_bytes())) if p.is_file() else [(h.update(str(f.relative_to("/app")).encode()), h.update(f.read_bytes())) for f in sorted(p.rglob("*")) if f.is_file()] for p in roots]; print(h.hexdigest())' > "$RUNNER_TEMP/worker-app-second.sha256"
          diff -u "$RUNNER_TEMP/worker-deps-first.txt" "$RUNNER_TEMP/worker-deps-second.txt"
          diff -u "$RUNNER_TEMP/worker-app-first.sha256" "$RUNNER_TEMP/worker-app-second.sha256"
          docker run --rm aios-firestore-worker:second python -m pip check
      - name: Preserve emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-emulator-${{ github.run_id }}
          path: ${{ runner.temp }}/firestore-emulator/
          if-no-files-found: warn
          retention-days: 14
