name: AIOS CI Per-Run Watchdog

on:
  workflow_run:
    workflows: ["CI"]
    types: [requested]

permissions:
  actions: write
  contents: read

concurrency:
  group: aios-ci-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Watch queue and execution window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          deadline=$(($(date +%s) + 2040))

          while true; do
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
            status="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            conclusion="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
            attempt="$(printf '%s' "$run_json" | python -c 'import json,sys; print(json.load(sys.stdin)["run_attempt"])')"
            echo "run=$RUN_ID status=$status conclusion=$conclusion attempt=$attempt"

            if [ "$status" = "completed" ]; then
              break
            fi

            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "WATCHDOG_TIMEOUT status=$status attempt=$attempt"

              WATCH_STATUS="$status" WATCH_ATTEMPT="$attempt" RUN_ID="$RUN_ID" HEAD_SHA="$HEAD_SHA" python - <<'PY'
          import os
          from core.ci_watchdog import CIWatch, classify_watch

          status = os.environ["WATCH_STATUS"]
          attempt = int(os.environ["WATCH_ATTEMPT"])
          age = 2040
          watch = CIWatch(
              repository="yanhul/AIOS",
              workflow="CI",
              run_id=int(os.environ["RUN_ID"]),
              sha=os.environ["HEAD_SHA"],
              status=status,
              conclusion=None,
              age_seconds=age,
              retry_count=max(0, attempt - 1),
          )
          print("AIOS_WATCHDOG_ACTION=" + classify_watch(watch))
          PY

              if [ "$attempt" -lt 3 ]; then
                echo "WATCHDOG_TIMEOUT -> cancel + bounded retry"
                gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null || true
                for i in $(seq 1 10); do
                  sleep 6
                  status2="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
                  [ "$status2" = "completed" ] && break
                done
                status2="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
                if [ "$status2" != "completed" ]; then
                  echo "RETRY_BLOCKED: old run did not reach terminal state"
                  exit 1
                fi
                gh api --method POST "repos/$REPOSITORY/actions/runs/$RUN_ID/rerun" >/dev/null
                echo "RETRY_SCHEDULED=attempt-$((attempt+1))"
                exit 0
              fi

              echo "RETRY_BUDGET_EXHAUSTED=BLOCKED"
              exit 1
            fi

            sleep 60
          done

          if [ "$conclusion" = "success" ]; then
            echo "CI_TERMINAL_SUCCESS"

            # Product workload receipts belong to Product E2E, not to the unit-CI run.
            # Only main push runs have a required same-SHA Product E2E companion.
            if [ "$CI_EVENT" != "push" ] || [ "$HEAD_BRANCH" != "main" ]; then
              echo "EVIDENCE_WATCHDOG=SKIP_NON_MAIN_PUSH event=$CI_EVENT branch=$HEAD_BRANCH"
              exit 0
            fi

            e2e_run_id=""
            e2e_conclusion=""
            evidence_deadline=$(($(date +%s) + 600))
            while true; do
              runs_json="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100")"
              e2e_run_id="$(printf '%s' "$runs_json" | python -c '
          import json,sys
          runs=json.load(sys.stdin).get("workflow_runs", [])
          matches=[r for r in runs if r.get("name")=="Product E2E Conformance" and r.get("event")=="push" and r.get("head_branch")=="main" and r.get("head_sha")==sys.argv[1]]
          matches.sort(key=lambda r:r.get("id",0), reverse=True)
          print(matches[0]["id"] if matches else "")
          ' "$HEAD_SHA")"
              e2e_status=""
              e2e_conclusion=""
              has_artifact="no"
              if [ -n "$e2e_run_id" ]; then
                e2e_json="$(gh api "repos/$REPOSITORY/actions/runs/$e2e_run_id")"
                e2e_status="$(printf '%s' "$e2e_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
                e2e_conclusion="$(printf '%s' "$e2e_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
                artifacts_json="$(gh api "repos/$REPOSITORY/actions/runs/$e2e_run_id/artifacts")"
                has_artifact="$(printf '%s' "$artifacts_json" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          print("yes" if any(a.get("name")==("aios-product-e2e-"+sys.argv[1]) and not a.get("expired") for a in d.get("artifacts", [])) else "no")
          ' "$e2e_run_id")"
                if [ "$e2e_status" = "completed" ] && [ "$has_artifact" = "yes" ]; then
                  break
                fi
              fi
              if [ "$(date +%s)" -ge "$evidence_deadline" ]; then
                echo "EVIDENCE_WATCHDOG_BLOCKED: no completed same-SHA Product E2E run with evidence artifact within 10 minutes"
                exit 1
              fi
              sleep 15
            done
            echo "PRODUCT_E2E_RUN=$e2e_run_id conclusion=$e2e_conclusion"

            mkdir -p "$RUNNER_TEMP/aios-evidence"
            gh run download "$e2e_run_id" -n "aios-product-e2e-$e2e_run_id" -D "$RUNNER_TEMP/aios-evidence"

            python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "aios-evidence"
          expected = {
              "yanhul__try.json",
              "yanhul__android-ai-assistant.json",
              "yanhul__RX50.json",
          }
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, {"files": sorted(files), "expected": sorted(expected)}

          expected_workloads = {
              "yanhul__try.json": "yanhul/try",
              "yanhul__android-ai-assistant.json": "yanhul/android-ai-assistant",
              "yanhul__RX50.json": "yanhul/RX50",
          }
          statuses = {}
          for path in sorted(root.glob("*.json")):
              obj = json.loads(path.read_text())
              expected_workload = expected_workloads[path.name]
              assert obj.get("workload_id") == expected_workload, {
                  "file": path.name, "workload_id": obj.get("workload_id"),
                  "expected": expected_workload,
              }
              assert obj.get("status") in {
                  "PASS", "BLOCKED", "INCONCLUSIVE",
                  "EDGE_FOUND", "NO_EDGE_FOUND", "REJECT", "PROMOTE",
              }, path.name
              assert obj.get("evidence_refs"), path.name
              assert obj.get("verification_refs"), path.name
              statuses[expected_workload] = obj["status"]
          print(json.dumps({"PRODUCT_E2E_RECEIPT_STATUSES": statuses}, sort_keys=True))
          blocked = {name: status for name, status in statuses.items() if status != "PASS"}
          assert not blocked, f"registered workload conformance not PASS: {blocked}"
          print("EVIDENCE_WATCHDOG=PASS")
          PY
          else
            echo "CI_TERMINAL_FAILURE=$conclusion -> repair/diagnosis wake"
          fi
