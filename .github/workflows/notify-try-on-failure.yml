name: Notify Try on CI Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.name != 'Notify Try on CI Failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch failure event
        env:
          GH_TOKEN: ${{ secrets.TRY_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TRY_DISPATCH_TOKEN is not configured; notification delivery is BLOCKED." >&2
            exit 0
          fi
          gh api repos/yanhul/try/dispatches \
            -H 'Accept: application/vnd.github+json' \
            -f event_type='ci_failure' \
            -f client_payload[repo]="$REPO" \
            -f client_payload[workflow]="$WORKFLOW" \
            -f client_payload[run_id]="$RUN_ID" \
            -f client_payload[run_url]="$RUN_URL" \
            -f client_payload[sha]="$SHA" \
            -f client_payload[branch]="$BRANCH" \
            -f client_payload[conclusion]="$CONCLUSION" \
            -f client_payload[message]="CI failure in $REPO/$WORKFLOW"
