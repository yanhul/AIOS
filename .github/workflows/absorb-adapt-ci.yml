name: Absorb Adapt Boundary CI

on:
  pull_request:
    paths:
      - "core/agent_orchestrator.py"
      - "tests/test_agent_orchestrator.py"
      - "docs/ABSORB_ADAPT_INTEGRATION.md"
      - ".github/workflows/absorb-adapt-ci.yml"
  push:
    branches: [main]
    paths:
      - "core/agent_orchestrator.py"
      - "tests/test_agent_orchestrator.py"
      - "docs/ABSORB_ADAPT_INTEGRATION.md"
      - ".github/workflows/absorb-adapt-ci.yml"

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test governed orchestration boundary
        run: python -m pytest -q tests/test_agent_orchestrator.py tests/test_absorbed_primitives.py
