name: Test Audit Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AIOS test authoring gate
        run: |
          python scripts/test_audit_gate.py
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate the gate itself
        run: python -m pytest -q tests/test_test_audit_gate.py
