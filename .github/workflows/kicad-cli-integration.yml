name: KiCad CLI Real Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/kicad/**"
      - "tests/test_kicad_adapter.py"
      - ".github/workflows/kicad-cli-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-cli-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  real-kicad-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install KiCad CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          command -v kicad-cli
          kicad-cli version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Exercise provider against real KiCad CLI
        env:
          AIOS_REQUIRE_KICAD_CLI: "1"
        run: python -m pytest -q tests/test_kicad_adapter.py -m integration
