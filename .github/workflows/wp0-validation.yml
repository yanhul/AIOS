name: WP0 exact-head validation

on:
  push:
    branches:
      - fix/opencode-p0-wp0

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Run complete test suite on pushed commit
        run: python -m pytest -q
