name: Windows process-tree containment

# Narrow, path-filtered job: only runs when the bounded subprocess layer or its
# regression tests change, so it does not consume CI quota on unrelated PRs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - adapters/bounded_process.py
      - tests/test_audit_f05_f06_closure.py
      - .github/workflows/windows-process-tree.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Sparse checkout: the repository contains state files whose names are
      # not valid on Windows (e.g. "policies/sha256:<digest>.json").
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            adapters
            core
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Process-tree / bounded subprocess tests (Windows)
        # F-05 process-tree tests only; tests that persist policy files are
        # excluded because policy filenames contain ':' (pre-existing, not F-05).
        run: python -m pytest -q -rs -k "f05 and not durably_retained" tests/test_audit_f05_f06_closure.py tests/test_audit_p1_p2_hardening.py
