name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_minimind_production:
        description: "Fail the minimind-capability-readiness job unless MiniMind is AVAILABLE"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stable check names for branch protection: "full-suite" and "minimind-key-isolation".
# No path filters: every PR update runs the full suite (security-relevant changes cannot be skipped).
jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML cryptography
      - name: Run test suite
        run: python -m pytest -q

  minimind-key-isolation:
    name: minimind-key-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest cryptography
      - name: Provision dedicated-UID boundary and run OS-level adversarial tests
        run: sudo bash scripts/minimind_isolation_e2e.sh "$GITHUB_WORKSPACE" "$(command -v python)"
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimind-key-isolation-${{ github.run_id }}
          path: /tmp/aios-isolation-logs/
          if-no-files-found: warn
          retention-days: 30

  # Non-production readiness report: MiniMind capability BLOCKED/INCONCLUSIVE is reported, not hidden,
  # and does not make full-suite green or red. Dispatch with require_minimind_production=true to make it
  # a hard production gate. Do not add this check to branch protection as evidence of runtime readiness.
  minimind-capability-readiness:
    name: minimind-capability-readiness (non-production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout MiniMind capability provider
        run: |
          git clone --depth 1 --no-checkout https://github.com/jingyaogong/minimind.git "$RUNNER_TEMP/minimind"
          git -C "$RUNNER_TEMP/minimind" fetch --depth 1 origin 6fc918beb68a0d8c40452338df6319fe168014ba
          git -C "$RUNNER_TEMP/minimind" checkout --detach 6fc918beb68a0d8c40452338df6319fe168014ba
      - name: Install pinned CPU smoke-test dependencies
        run: python -m pip install torch==2.6.0 transformers==4.57.6 datasets==3.6.0
      - name: Check MiniMind capability
        env:
          MINIMIND_ROOT: ${{ runner.temp }}/minimind
          MINIMIND_EXPECTED_REV: 6fc918beb68a0d8c40452338df6319fe168014ba
          REQUIRE: ${{ inputs.require_minimind_production && 'true' || 'false' }}
        run: |
          flag=""; [ "$REQUIRE" = true ] && flag="--require-available"
          python scripts/check_minimind_capability.py --root "$RUNNER_TEMP/minimind" $flag

