name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Run test suite
        run: python -m pytest -q
      - name: Checkout registered workloads
        run: |
          git clone --depth 1 https://github.com/yanhul/try.git "$RUNNER_TEMP/try"
          git -C "$RUNNER_TEMP/try" fetch --depth 1 origin 4ec189b719b7d880973e7ebc3bef84a38cee51db
          git -C "$RUNNER_TEMP/try" checkout --detach 4ec189b719b7d880973e7ebc3bef84a38cee51db
          git clone --depth 1 https://github.com/yanhul/android-ai-assistant.git "$RUNNER_TEMP/android-ai-assistant"
          git -C "$RUNNER_TEMP/android-ai-assistant" fetch --depth 1 origin 2df06a12c83ad1adcd8cf5c6d7287fe95f242000
          git -C "$RUNNER_TEMP/android-ai-assistant" checkout --detach 2df06a12c83ad1adcd8cf5c6d7287fe95f242000
          git clone --depth 1 https://github.com/yanhul/RX50.git "$RUNNER_TEMP/RX50"
          git -C "$RUNNER_TEMP/RX50" fetch --depth 1 origin 42d2993df72e699528d3469526c2335e8f7ab218
          git -C "$RUNNER_TEMP/RX50" checkout --detach 42d2993df72e699528d3469526c2335e8f7ab218
      - name: Run live three-workload conformance
        run: |
          python scripts/run_3_workload_conformance.py \
            --root yanhul/try "$RUNNER_TEMP/try" \
            --root yanhul/android-ai-assistant "$RUNNER_TEMP/android-ai-assistant" \
            --root yanhul/RX50 "$RUNNER_TEMP/RX50"
