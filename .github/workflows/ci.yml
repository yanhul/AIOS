name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Run test suite
        run: python -m pytest -q
      - name: Checkout registered workloads
        run: |
          git clone --depth 1 https://github.com/yanhul/try.git "$RUNNER_TEMP/try"
          git -C "$RUNNER_TEMP/try" fetch --depth 1 origin 464f7c0059d6f9b1dcb02cab98ba68358f8aeba9
          git -C "$RUNNER_TEMP/try" checkout --detach 464f7c0059d6f9b1dcb02cab98ba68358f8aeba9
          git clone --depth 1 https://github.com/yanhul/android-ai-assistant.git "$RUNNER_TEMP/android-ai-assistant"
          git -C "$RUNNER_TEMP/android-ai-assistant" fetch --depth 1 origin 02920c71ff4046f512a327db436b84e70641cb5b
          git -C "$RUNNER_TEMP/android-ai-assistant" checkout --detach 02920c71ff4046f512a327db436b84e70641cb5b
          git clone --depth 1 https://github.com/yanhul/RX50.git "$RUNNER_TEMP/RX50"
          git -C "$RUNNER_TEMP/RX50" fetch --depth 1 origin 1f1abf3df019b2c40a89218f726620e6e3a96e25
          git -C "$RUNNER_TEMP/RX50" checkout --detach 1f1abf3df019b2c40a89218f726620e6e3a96e25
      - name: Run live three-workload conformance
        run: |
          python scripts/run_3_workload_conformance.py \
            --root yanhul/try "$RUNNER_TEMP/try" \
            --root yanhul/android-ai-assistant "$RUNNER_TEMP/android-ai-assistant" \
            --root yanhul/RX50 "$RUNNER_TEMP/RX50"
      - name: Require product E2E conformance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/conformance")
          expected = {"yanhul__try.json", "yanhul__android-ai-assistant.json", "yanhul__RX50.json"}
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, (files, expected)
          results = {p.name: json.loads(p.read_text()) for p in root.glob("*.json")}
          allowed = {"PASS", "BLOCKED"}
          invalid = {name: obj.get("status") for name, obj in results.items() if obj.get("status") not in allowed}
          assert not invalid, f"ungoverned product result: {invalid}"
          missing_evidence = {
              name: obj.get("status") for name, obj in results.items()
              if not obj.get("evidence_refs") or not obj.get("verification_refs")
          }
          assert not missing_evidence, f"product result missing evidence/verification: {missing_evidence}"
          summary = {name: obj["status"] for name, obj in sorted(results.items())}
          print(json.dumps({"PRODUCT_E2E_CONFORMANCE_PASS": summary}, sort_keys=True))
          PY
