name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Run test suite
        run: python -m pytest -q
      - name: Checkout registered workloads
        run: |
          git clone --depth 1 https://github.com/yanhul/try.git "$RUNNER_TEMP/try"
          git -C "$RUNNER_TEMP/try" fetch --depth 1 origin 35790dfae6bde370d3c95292b4f88a48bd48cfb8
          git -C "$RUNNER_TEMP/try" checkout --detach 35790dfae6bde370d3c95292b4f88a48bd48cfb8
          git clone --depth 1 https://github.com/yanhul/android-ai-assistant.git "$RUNNER_TEMP/android-ai-assistant"
          git -C "$RUNNER_TEMP/android-ai-assistant" fetch --depth 1 origin 4869cd8d86e62f03d6d3fa29190f0b726f84b417
          git -C "$RUNNER_TEMP/android-ai-assistant" checkout --detach 4869cd8d86e62f03d6d3fa29190f0b726f84b417
          git clone --depth 1 https://github.com/yanhul/RX50.git "$RUNNER_TEMP/RX50"
          git -C "$RUNNER_TEMP/RX50" fetch --depth 1 origin 1f1abf3df019b2c40a89218f726620e6e3a96e25
          git -C "$RUNNER_TEMP/RX50" checkout --detach 1f1abf3df019b2c40a89218f726620e6e3a96e25
      - name: Run live three-workload conformance
        run: |
          python scripts/run_3_workload_conformance.py \
            --root yanhul/try "$RUNNER_TEMP/try" \
            --root yanhul/android-ai-assistant "$RUNNER_TEMP/android-ai-assistant" \
            --root yanhul/RX50 "$RUNNER_TEMP/RX50"
      - name: Require product E2E PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/conformance")
          expected = {"yanhul__try.json", "yanhul__android-ai-assistant.json", "yanhul__RX50.json"}
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, (files, expected)
          results = {p.name: json.loads(p.read_text()) for p in root.glob("*.json")}
          bad = {name: obj["status"] for name, obj in results.items() if obj["status"] != "PASS"}
          assert not bad, f"product E2E gate failed: {bad}"
          print("PRODUCT_E2E_PASS")
          PY
