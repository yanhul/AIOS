name: AIOS CI Wake Supervisor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate and persist CI event
        env:
          EVENT_JSON: ${{ toJson(github.event.workflow_run) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from core.ci_supervisor import DurableCIInbox, event_from_mapping

          raw = json.loads(os.environ["EVENT_JSON"])
          head = raw.get("head_commit") or {}
          event = event_from_mapping({
              "repository": os.environ["REPOSITORY"],
              "workflow": raw.get("name", ""),
              "run_id": raw.get("id"),
              "sha": raw.get("head_sha", ""),
              "conclusion": raw.get("conclusion", ""),
              "ref": raw.get("head_branch") or raw.get("head_repository", {}).get("full_name", ""),
          })
          inbox = DurableCIInbox(os.path.join(os.environ["RUNNER_TEMP"], "aios-ci-inbox"))
          state = inbox.receive(event, os.environ["REPOSITORY"])
          print(json.dumps({
              "AIOS_CI_WAKE": "ACCEPTED",
              "event_id": event.event_id,
              "run_id": event.run_id,
              "sha": event.sha,
              "conclusion": event.conclusion,
              "next_action": state.next_action,
          }, sort_keys=True))
          PY

      - name: Publish durable wake artifact
        uses: actions/upload-artifact@v4
        with:
          name: aios-ci-event-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/aios-ci-inbox/*.json
          if-no-files-found: error
          retention-days: 90
