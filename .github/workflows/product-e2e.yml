name: Product E2E Conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Product E2E Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run durable crash/recovery conformance
        run: |
          PYTHONPATH="$PWD" python scripts/product_e2e_durable_crash_recovery.py
      - name: Publish crash/recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-durable-crash-recovery-${{ github.run_id }}
          path: artifacts/conformance/durable-crash-recovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Require durable crash/recovery conformance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/conformance/durable-crash-recovery.json").read_text())
          assert result["status"] == "PASS", result
          assert result["durable_state_before_resume"] == "DISPATCHED", result
          assert result["resume_state"] == "OBSERVED_SUCCESS", result
          assert result["same_attempt_identity"] is True, result
          assert result["duplicate_retry"] is False, result
          assert result["evidence_refs"] and result["verification_refs"], result
          print(json.dumps({"DURABLE_CRASH_RECOVERY_PASS": True}, sort_keys=True))
          PY

  product-e2e:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIOS_R2_BUCKET: ${{ vars.AIOS_R2_BUCKET }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Product E2E Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Checkout registered workloads
        run: |
          git clone --depth 1 --no-checkout https://github.com/yanhul/try.git "$RUNNER_TEMP/try"
          # Pin the registered TRY workload to the reviewed immutable main SHA.
          # Update this pin only after the new TRY revision passes its own strict gates.
          TRY_AUTHORITY_SHA="c667122241aa2574fa274c9c7035dd6c7cdecd06"
          git -C "$RUNNER_TEMP/try" fetch --depth 1 origin "$TRY_AUTHORITY_SHA"
          git -C "$RUNNER_TEMP/try" checkout --detach "$TRY_AUTHORITY_SHA"
          test "$(git -C "$RUNNER_TEMP/try" rev-parse HEAD)" = "$TRY_AUTHORITY_SHA"
          echo "TRY_AUTHORITY_SHA=$TRY_AUTHORITY_SHA"
          git clone --depth 1 --no-checkout https://github.com/yanhul/android-ai-assistant.git "$RUNNER_TEMP/android-ai-assistant"
          git -C "$RUNNER_TEMP/android-ai-assistant" fetch --depth 1 origin refs/heads/aios-conformance/android:refs/remotes/origin/aios-conformance/android
          git -C "$RUNNER_TEMP/android-ai-assistant" checkout --detach refs/remotes/origin/aios-conformance/android
          test "$(git -C "$RUNNER_TEMP/android-ai-assistant" rev-parse HEAD)" = "56b1bcf7fd2d4cede6e151e981a4b9063a464d28"
          git clone --depth 1 --no-checkout https://github.com/yanhul/RX50.git "$RUNNER_TEMP/RX50"
          git -C "$RUNNER_TEMP/RX50" fetch --depth 1 origin refs/heads/aios-conformance/rx50:refs/remotes/origin/aios-conformance/rx50
          git -C "$RUNNER_TEMP/RX50" checkout --detach refs/remotes/origin/aios-conformance/rx50
          test "$(git -C "$RUNNER_TEMP/RX50" rev-parse HEAD)" = "040e462ef63bc03fe4d5448a6dbf68dde0e4f6eb"
      - name: Run live registered-workload conformance
        run: |
          python scripts/run_3_workload_conformance.py             --root yanhul/try "$RUNNER_TEMP/try"             --root yanhul/android-ai-assistant "$RUNNER_TEMP/android-ai-assistant"             --root yanhul/RX50 "$RUNNER_TEMP/RX50"
      - name: Checkout MiniMind capability provider
        run: |
          git clone --depth 1 --no-checkout https://github.com/jingyaogong/minimind.git "$RUNNER_TEMP/minimind"
          git -C "$RUNNER_TEMP/minimind" fetch --depth 1 origin 6fc918beb68a0d8c40452338df6319fe168014ba
          git -C "$RUNNER_TEMP/minimind" checkout --detach 6fc918beb68a0d8c40452338df6319fe168014ba
      - name: Check MiniMind capability
        env:
          MINIMIND_ROOT: ${{ runner.temp }}/minimind
          MINIMIND_EXPECTED_REV: 6fc918beb68a0d8c40452338df6319fe168014ba
        run: python scripts/check_minimind_capability.py --root "$RUNNER_TEMP/minimind"
      - name: Publish E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-product-e2e-${{ github.run_id }}
          path: artifacts/conformance/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Mirror verified Product E2E evidence to R2 (pilot)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.AIOS_R2_BUCKET != '' && hashFiles('artifacts/conformance/yanhul__try.json', 'artifacts/conformance/yanhul__android-ai-assistant.json', 'artifacts/conformance/yanhul__RX50.json') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIOS_R2_BUCKET: ${{ vars.AIOS_R2_BUCKET }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -d artifacts/conformance
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("artifacts/conformance")
          files = sorted(p for p in root.glob("*.json") if p.is_file())
          expected = {"yanhul__try.json", "yanhul__android-ai-assistant.json", "yanhul__RX50.json"}
          names = {p.name for p in files}
          if names != expected:
              raise SystemExit(f"R2 pilot refuses incomplete/unexpected evidence set: {sorted(names)}")
          entries = []
          for path in files:
              raw = path.read_bytes()
              entries.append({
                  "name": path.name,
                  "key": f"evidence/{os.environ['REPOSITORY']}/{os.environ['RUN_ID']}/{os.environ['HEAD_SHA']}/{path.name}",
                  "size_bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          manifest = {
              "schema": "aios.r2-evidence-manifest/v1",
              "repository": os.environ["REPOSITORY"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "commit_sha": os.environ["HEAD_SHA"],
              "files": entries,
          }
          Path(os.environ["RUNNER_TEMP"], "aios-r2-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          PREFIX="evidence/$REPOSITORY/$RUN_ID/$HEAD_SHA"
          npx --yes wrangler@4 r2 object put "$AIOS_R2_BUCKET/$PREFIX/yanhul__try.json" --file artifacts/conformance/yanhul__try.json --remote
          npx --yes wrangler@4 r2 object put "$AIOS_R2_BUCKET/$PREFIX/yanhul__android-ai-assistant.json" --file artifacts/conformance/yanhul__android-ai-assistant.json --remote
          npx --yes wrangler@4 r2 object put "$AIOS_R2_BUCKET/$PREFIX/yanhul__RX50.json" --file artifacts/conformance/yanhul__RX50.json --remote
          npx --yes wrangler@4 r2 object put "$AIOS_R2_BUCKET/$PREFIX/manifest.json" --file "$RUNNER_TEMP/aios-r2-manifest.json" --remote
          mkdir -p "$RUNNER_TEMP/aios-r2-roundtrip"
          npx --yes wrangler@4 r2 object get "$AIOS_R2_BUCKET/$PREFIX/manifest.json" --file "$RUNNER_TEMP/aios-r2-roundtrip/manifest.json" --remote
          cmp "$RUNNER_TEMP/aios-r2-manifest.json" "$RUNNER_TEMP/aios-r2-roundtrip/manifest.json"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          root = Path("artifacts/conformance")
          manifest = json.loads(Path(os.environ["RUNNER_TEMP"], "aios-r2-manifest.json").read_text())
          bucket = os.environ["AIOS_R2_BUCKET"]
          out = Path(os.environ["RUNNER_TEMP"], "aios-r2-roundtrip")
          for item in manifest["files"]:
              target = out / item["name"]
              key = item["key"]
              subprocess.run([
                  "npx", "--yes", "wrangler@4", "r2", "object", "get",
                  f"{bucket}/{key}",
                  "--file", str(target), "--remote"
              ], check=True)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if digest != item["sha256"] or target.stat().st_size != item["size_bytes"]:
                  raise SystemExit(f"R2 round-trip integrity mismatch: {item['name']}")
          print(json.dumps({"AIOS_R2_EVIDENCE_MIRROR": "PASS", "objects": len(manifest["files"]), "manifest_sha256": hashlib.sha256(Path(os.environ["RUNNER_TEMP"], "aios-r2-manifest.json").read_bytes()).hexdigest()}, sort_keys=True))
          PY

      - name: Require registered workload conformance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/conformance")
          expected = {
              "yanhul__try.json",
              "yanhul__android-ai-assistant.json",
              "yanhul__RX50.json",
          }
          files = {p.name for p in root.glob("*.json")}
          assert files == expected, (files, expected)
          results = {p.name: json.loads(p.read_text()) for p in root.glob("*.json")}
          invalid = {}
          rx50 = results["yanhul__RX50.json"]
          rx50_blocked_is_valid = (
              rx50.get("status") == "BLOCKED"
              and rx50.get("reason") == "physical evidence required before engineering promotion"
              and {"requirements_coverage", "contradiction_check"}.issubset(
                  set(rx50.get("verification_refs", []))
              )
              and "physical_evidence" not in rx50.get("verification_refs", [])
          )
          for name, obj in results.items():
              if name == "yanhul__RX50.json":
                  rx50_pass_is_valid = (
                      obj.get("status") == "PASS"
                      and "physical_evidence" in obj.get("evidence_refs", [])
                      and "physical_evidence" in obj.get("verification_refs", [])
                  )
                  if rx50_blocked_is_valid or rx50_pass_is_valid:
                      continue
                  invalid[name] = obj.get("status")
                  continue
              if obj.get("status") == "PASS":
                  continue
              invalid[name] = obj.get("status")
          assert not invalid, f"unexpected product conformance outcomes: {invalid}"
          missing_evidence = {
              name: obj.get("status") for name, obj in results.items()
              if not obj.get("evidence_refs") or not obj.get("verification_refs")
          }
          assert not missing_evidence, f"product result missing evidence/verification: {missing_evidence}"
          summary = {name: obj["status"] for name, obj in sorted(results.items())}
          print(json.dumps({"REGISTERED_WORKLOAD_CONFORMANCE_PASS": summary}, sort_keys=True))
          PY
